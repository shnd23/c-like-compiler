[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minic"
version = "1.0.0"
description = "A compiler and stack virtual machine for MiniC, a small C-like language"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
minic = "minic.cli:main"

[tool.setuptools]
packages = ["minic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
